aid: inrisk
name: InRisk
description: 'InRisk Labs is a climate insurtech company building parametric insurance
  products for climate and disaster risk financing. Its platform pairs an AI-driven
  pricing engine, real-time geospatial and weather monitoring, and blockchain smart
  contracts to deliver rapid, data-triggered payouts across 15+ parametric products
  spanning agriculture (crop, livestock, agri-input), renewable energy (solar, wind),
  logistics, tourism, energy demand, infrastructure protection, and wage and business-interruption
  cover. Risk models incorporate global climate drivers such as ENSO and IOD and range
  from India to global coverage. InRisk exposes an "API on-demand" so insurance partners
  can integrate customized products, dynamic pricing, and real-time analytics into
  their own infrastructure. Surfaced as a portfolio company of Bessemer Venture Partners.'
